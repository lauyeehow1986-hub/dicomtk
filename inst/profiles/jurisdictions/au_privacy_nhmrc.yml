id: au_privacy_nhmrc
name: "Australia Privacy Act 1988 & NHMRC National Statement on Ethical Conduct"
disclaimer: "Technical template only; not legal advice."
date_policy: shift_per_patient
age_cap_years: ~
zip_prefix_digits: ~
regex_scrubbers:
  - "\\b[2-6][0-9]{9}\\b"
  - "\\b(?:\\+?61)?[23478][0-9]{8}\\b"
  - "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
tag_overrides:
  "(0010,0010)": "X"
  "(0010,0020)": "Z"
  "(0010,1040)": "X"

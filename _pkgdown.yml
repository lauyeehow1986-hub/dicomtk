url: https://lauyeehow1986-hub.github.io/dicomtk/
template:
  bootstrap: 5

reference:
  - title: "3D/4D Volume Geometry & Coordinate Spaces"
    desc: "Standards-compliant 3D/4D DICOM volume reconstruction, LPS/RAS coordinate transforms, and slicing."
    contents:
      - read_dicom_volume
      - dicom_split_series
      - new_dicom_volume
      - is_dicom_volume
      - "[.dicom_volume"
      - plot.dicom_volume
      - dicom_orientation
      - to_ras
      - voxel_to_world
      - world_to_voxel

  - title: "Core DICOM I/O"
    desc: "Read and write DICOM headers, pixel matrices, and 3D multi-slice series."
    contents:
      - read_dicom
      - read_dicom_header
      - read_dicom_pixels
      - read_dicom_series
      - write_dicom
      - is_dicom
      - have_dcmtk
      - dicom_info
      - dicom_sync_upstream

  - title: "Synthetic Modality Phantoms"
    desc: "Generate analytical multi-slice DICOM series (CT, MR, PET) with known ground-truth geometry."
    contents:
      - dicom_synthesize

  - title: "Quantitative Modality Transforms"
    desc: "PET SUV quantification, Mammography VOI LUT curves, and Philips MR private scaling."
    contents:
      - dicom_pet_suv
      - dicom_apply_voi_lut
      - dicom_mr_rescale

  - title: "DICOM Tags & Dictionary"
    desc: "Inspect, modify, and query the 5,354-tag DCMTK 3.7.1 data dictionary."
    contents:
      - dicom_tags
      - dicom_tag_value
      - dicom_modify
      - dicom_tag_lookup
      - dcmdump_full
      - date_tags
      - datetime_tags
      - removal_tags

  - title: "De-identification & Privacy Engine"
    desc: "Regulatory-grade PS3.15 de-identification, jurisdiction presets, pixel cleaning, 3D defacing, and risk auditing."
    contents:
      - dicom_deid
      - dicom_deid_profile
      - dicom_list_jurisdictions
      - dicom_key_provider
      - is_dicom_key_provider
      - deid_map_uid
      - deid_patient_shift
      - derive_patient_shift_days
      - dicom_crosswalk_read
      - dicom_detect_burned_phi
      - dicom_clean_pixels
      - dicom_deface
      - dicom_deid_verify
      - dicom_verify_attestation
      - dicom_deid_risk
      - dicom_anonymize

  - title: "Visualization (ggplot2, Shiny, and 3D Volume)"
    desc: "Clinical windowing, ggplot2 rendering, interactive Shiny viewer, and 3D MPR/MIP/rgl."
    contents:
      - dicom_window
      - plot_dicom
      - ggdicom
      - dicom_viewer
      - render_volume

  - title: "Conversion & Compression"
    desc: "Convert between DICOM, PNG, NIfTI, XML, JSON, PDF, and RLE compression."
    contents:
      - write_nifti
      - dicom_to_nifti
      - dicom_to_png
      - dcm2xml
      - dcm2json
      - dcm2pdf
      - dicom_compress
      - dicom_decompress

  - title: "PACS Networking & Worklists"
    desc: "DIMSE C-ECHO, C-FIND, C-GET, C-STORE, local index DB, worklists, and TLS."
    contents:
      - dicom_connect
      - dicom_echo
      - dicom_find
      - dicom_get
      - dicom_send
      - dicom_receive
      - dicom_qrdb_index
      - dicom_worklist
      - dicom_tls_config

  - title: "Structured Reports & Specialized IODs (RT, SEG, PMAP, Tractography)"
    desc: "Interfaces for dcmsr, dcmrt, dcmseg, dcmpmap, dcmtract, dcmect, dcmpstat, and dcmsign."
    contents:
      - read_dicom_sr
      - create_dicom_sr
      - dicom_sr_tid1500
      - read_sr_tid1500
      - read_dicom_rt
      - read_dicom_seg
      - dicom_seg
      - write_dicom_seg
      - as_labelmap
      - rtstruct_to_seg
      - seg_to_rtstruct
      - dicom_dvh
      - rasterize_polygon_2d
      - rasterize_polygons_2d
      - trace_contours_2d
      - write_dicom_gsps
      - read_dicom_gsps
      - read_dicom_pmap
      - read_dicom_tract
      - read_dicom_pstate
      - read_dicom_ect
      - dicom_verify_signature

  - title: "Deep Learning Prep, QC & Dataset Exporters"
    desc: "3D resampling, intensity windowing, patient-level splits, automated QC, burned-in annotations, and nnU-Net/MONAI/RO-Crate/Croissant export."
    contents:
      - volume_resample
      - volume_window
      - dicom_patient_splits
      - dicom_image_qc
      - dicom_burn_annotations
      - burned_annot
      - export_nnunet
      - export_monai
      - export_rocrate
      - export_croissant

  - title: "AI & LLM Integration (Ollama, OpenAI, Claude)"
    desc: "Connect DICOM studies and images to local Ollama and cloud OpenAI/Anthropic models."
    contents:
      - dicom_llm
      - ollama_list_models
      - dicom_summarize
      - dicom_describe_image
      - dicom_report
      - dicom_ask


  - title: "DICOMweb (QIDO-RS, WADO-RS, STOW-RS)"
    desc: "PS3.18 DICOM JSON, RFC 2387 binary multipart/related framing, OAuth2, and QIDO/WADO/STOW REST clients."
    contents:
      - as_dicom_json
      - from_dicom_json
      - pack_multipart_dicom
      - unpack_multipart_dicom
      - dicomweb_qido
      - dicomweb_metadata
      - dicomweb_wado
      - dicomweb_stow

  - title: "HL7 FHIR R4/R5 & Synthea Linkage"
    desc: "Bi-directional ImagingStudy, ImagingSelection, DiagnosticReport, Provenance, W3C PROV, and Synthea cohort linkage."
    contents:
      - as_fhir_imaging_study
      - from_fhir_imaging_study
      - as_fhir_imaging_selection
      - as_fhir_diagnostic_report
      - as_fhir_provenance
      - as_w3c_prov
      - fhir_post
      - fhir_get
      - link_synthea_cohort

  - title: "DuckDB/Parquet Archive Index & NL-to-SQL"
    desc: "Normalized 3-table study/series/instance index, Parquet export, and read-only SQL cohort builder."
    contents:
      - dicom_index_build
      - dicom_index_query
      - dicom_index_close
      - validate_readonly_sql
      - dicom_cohort_nl
      - export_cohort_spec
      - run_cohort_spec

  - title: "OHDSI OMOP Medical Imaging CDM (MI-CDM)"
    desc: "Map studies, segmentations, and TID 1500 SR metrics into OMOP image_occurrence and image_feature tables."
    contents:
      - omop_imaging_concepts
      - to_omop_image_occurrence
      - to_omop_image_feature
      - write_omop_micdm

  - title: "Whole Slide Imaging (WSI) & Sup 222 Annotations"
    desc: "Multi-resolution WSI pyramid reader, out-of-core tile stitching, and Microscopy Bulk Simple Annotations."
    contents:
      - dicom_synthesize_wsi
      - read_dicom_wsi_pyramid
      - wsi_extract_tile
      - wsi_stitch_region
      - dicom_wsi_annotations
      - wsi_annotations_to_mask

  - title: "Legacy Compatibility"
    desc: "Backward-compatible wrappers for original dcmtk R package functions."
    contents:
      - legacy-dcmtk
